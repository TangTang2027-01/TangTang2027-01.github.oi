<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公考WorkBuddy · 备考工作台</title>
<style>
/* ============ 设计系统 · 森系薄荷桃粉 ============ */
:root{
  --primary:#8FA88D;           /* 主色：灰绿 */
  --primary-light:#B4C6AE;     /* 辅助：浅灰绿 */
  --primary-dark:#6d8a6b;
  --primary-bg:#eef2ec;        /* 极浅绿背景 */
  --primary-bg2:#dfe7db;
  --accent:#39D6C2;            /* 强调：青翡翠 */
  --accent-light:#8de8d8;
  --info:#8cccd3;              /* 薄荷蓝 */
  --info-bg:#eaf7f9;
  --purple:#b8a0c6;
  --purple-bg:#f3edf7;
  --success:#7aaa8a;
  --danger:#e8a0a0;            /* 浅桃粉红 */
  --warn:#f0c090;              /* 暖杏 */
  --bg:#ECE8DC;                /* 页面底色：暖米白 */
  --card:#ffffff;
  --border:#ddd8cc;
  --border-light:#e8e4da;
  --text:#3a3530;
  --text-light:#7a7268;
  --text-muted:#b0a898;
  --shadow:0 1px 3px rgba(120,110,95,.06),0 1px 2px rgba(0,0,0,.03);
  --shadow-md:0 4px 14px rgba(120,110,95,.08);
  --radius:12px;
  --radius-sm:7px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.65;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:13.5px}
a{color:var(--primary);text-decoration:none;cursor:pointer}

/* ============ 布局 ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:218px;background:linear-gradient(180deg,var(--primary-dark),var(--primary));color:#fff;flex-shrink:0;
  position:fixed;top:0;bottom:0;left:0;padding:22px 0 30px;overflow-y:auto;z-index:100;
}
.sidebar .logo{padding:0 22px 20px;border-bottom:1px solid rgba(255,255,255,.13);margin-bottom:14px}
.sidebar .logo h1{font-size:17px;font-weight:700;letter-spacing:.3px}
.sidebar .logo .sub{font-size:11px;opacity:.75;margin-top:5px}
.sidebar .countdown-mini{padding:10px 22px;font-size:12px;opacity:.85;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.sidebar .countdown-mini b{font-size:22px;color:#fff;display:block;line-height:1.2}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 22px;
  color:rgba(255,255,255,.72);font-size:13px;cursor:pointer;
  border-left:3px solid transparent;transition:all .15s;
}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:rgba(255,255,255,.13);color:#fff;border-left-color:var(--accent-light)}
.nav-item .num{font-size:15px;width:18px;text-align:center;font-weight:600}
.main{flex:1;margin-left:218px;padding:26px 32px 60px;max-width:calc(100vw - 218px)}
.page{display:none}
.page.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.page-header h2{font-size:20px;font-weight:700;color:var(--primary-dark)}
.page-header .sub{font-size:12px;color:var(--text-light);margin-top:2px}
.btn{
  display:inline-flex;align-items:center;gap:5px;padding:7px 14px;
  background:var(--primary);color:#fff;border-radius:var(--radius-sm);font-size:13px;transition:all .15s;
}
.btn:hover{background:var(--primary-light)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{background:var(--primary-bg);border-color:var(--primary)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{background:var(--danger)}
.btn.accent{background:var(--accent);color:#fff}

/* ============ 卡片 ============ */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--border-light)}
.card h3{font-size:14.5px;font-weight:600;margin-bottom:14px;color:var(--primary-dark);display:flex;align-items:center;gap:7px}
.card h3 .tag{font-size:11px;font-weight:400;color:var(--text-muted);margin-left:auto}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:1fr 1fr 1fr}
.grid-4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.grid-3,.grid-4{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}}

/* ============ 倒计时 ============ */
.countdown-box{
  background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;
  border-radius:var(--radius);padding:22px 26px;text-align:center;position:relative;overflow:hidden;
}
.countdown-box::after{content:"";position:absolute;top:-20px;right:-20px;width:80px;height:80px;background:rgba(255,255,255,.06);border-radius:50%}
.countdown-box .days{font-size:58px;font-weight:800;line-height:1;letter-spacing:-1px}
.countdown-box .days-label{font-size:12px;opacity:.8;margin-top:5px}
.countdown-box .target{font-size:11px;opacity:.65;margin-top:8px}
.countdown-box .phase{display:inline-block;margin-top:10px;padding:3px 13px;background:rgba(255,255,255,.16);border-radius:18px;font-size:11px}

/* ============ 进度环 ============ */
.ring-wrap{display:flex;align-items:center;gap:14px}
.ring-svg{width:88px;height:88px;flex-shrink:0}
.ring-svg circle{fill:none;stroke-width:8}
.ring-bg{stroke:var(--border-light)}
.ring-fg{stroke:var(--primary);stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dashoffset .4s}
.ring-fg.success{stroke:var(--success)}
.ring-fg.warn{stroke:var(--warn)}
.ring-text{font-size:10px;fill:var(--text-light)}
.ring-val{font-size:17px;font-weight:700;fill:var(--primary-dark)}
.ring-info{flex:1}
.ring-info .num{font-size:22px;font-weight:700;color:var(--primary-dark)}
.ring-info .lbl{font-size:12px;color:var(--text-light)}

/* ============ 习惯打卡 ============ */
.habit-list{display:flex;flex-direction:column;gap:7px}
.habit{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--primary-bg);border-radius:var(--radius-sm);transition:all .15s;cursor:pointer}
.habit.done{background:#dfe7db}
.habit .check{width:19px;height:19px;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:transparent;transition:all .15s}
.habit.done .check{background:var(--success);border-color:var(--success);color:#fff}
.habit .h-name{flex:1;font-size:13px}
.habit.done .h-name{text-decoration:line-through;color:var(--text-muted)}

/* ============ 时段任务表 ============ */
.session{border-left:3px solid var(--primary);padding:10px 14px;margin-bottom:10px;background:var(--primary-bg);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.session.t2{border-left-color:var(--info);background:var(--info-bg)}
.session.t3{border-left-color:var(--accent);background:#fdf6e8}
.session.t4{border-left-color:var(--purple);background:var(--purple-bg)}
.session .s-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.session .s-title{font-weight:600;font-size:13px}
.session .s-time{font-size:11px;color:var(--text-light);background:#fff;padding:2px 8px;border-radius:10px}
.task-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.task-item .t-check{width:15px;height:15px;border:1.5px solid var(--border);border-radius:3px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:transparent}
.task-item.done .t-check{background:var(--success);border-color:var(--success);color:#fff}
.task-item.done .t-text{text-decoration:line-through;color:var(--text-muted)}

/* 11时段表格 */
.time-table{width:100%;border-collapse:collapse;font-size:12px}
.time-table th,.time-table td{padding:7px 8px;text-align:left;border-bottom:1px solid var(--border-light)}
.time-table th{font-weight:600;color:var(--text-light);font-size:11px;background:var(--primary-bg);position:sticky;top:0}
.time-table tr:hover td{background:var(--primary-bg)}
.time-table .col-time{font-weight:600;color:var(--primary-dark);white-space:nowrap}
.time-table .col-task{font-weight:500}
.time-table .col-dur{color:var(--text-light);white-space:nowrap}
.tt-btn{padding:3px 8px;font-size:11px;border-radius:5px;border:1px solid var(--border);background:#fff;color:var(--text-light);cursor:pointer}
.tt-btn.done{background:var(--success);color:#fff;border-color:var(--success)}

/* ============ 表格 ============ */
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border-light)}
table.data th{font-weight:600;color:var(--text-light);font-size:12px;background:var(--primary-bg)}
table.data tr:hover td{background:var(--primary-bg)}

/* ============ 表单 ============ */
.form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.form-row > *{flex:1;min-width:120px}
.input,textarea,select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:#fff;font-size:13px}
.input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(120,110,95,.12)}
label{font-size:12px;color:var(--text-light);display:block;margin-bottom:4px}
textarea{resize:vertical;min-height:55px}

/* ============ 标签 ============ */
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--primary-bg);color:var(--primary-dark)}
.tag.green{background:#dfe7db;color:var(--success)}
.tag.blue{background:var(--info-bg);color:var(--info)}
.tag.red{background:#fce8e7;color:var(--danger)}
.tag.yellow{background:#fdf6e8;color:var(--warn)}
.tag.purple{background:var(--purple-bg);color:var(--purple)}
.tag.gray{background:#f0f2f1;color:var(--text-light)}

/* ============ 进度条 ============ */
.progress{height:7px;background:var(--border-light);border-radius:4px;overflow:hidden}
.progress > div{height:100%;background:var(--primary);border-radius:4px;transition:width .4s}
.progress > div.success{background:var(--success)}
.progress > div.warn{background:var(--warn)}
.progress > div.info{background:var(--info)}

/* ============ 热力图 ============ */
.heatmap{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat-cell{aspect-ratio:1;border-radius:4px;background:var(--border-light);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--text-muted)}
.heat-cell.l1{background:#c8e6d5}
.heat-cell.l2{background:#8fcfae}
.heat-cell.l3{background:#52b083}
.heat-cell.l4{background:var(--primary);color:#fff}

/* ============ 思维导图树 ============ */
.mindmap-tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.mindmap-tab{padding:6px 14px;border-radius:18px;font-size:12.5px;cursor:pointer;background:var(--bg);color:var(--text-light);border:1px solid var(--border)}
.mindmap-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.tree{padding-left:0}
.tree-node{position:relative;padding-left:18px;margin:3px 0}
.tree-node::before{content:"";position:absolute;left:5px;top:0;bottom:50%;border-left:2px solid var(--border);border-bottom:2px solid var(--border);width:9px}
.tree-node.root{padding-left:0;font-weight:600}
.tree-node.root::before{display:none}
.tree-toggle{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:5px}
.tree-toggle .arrow{font-size:9px;transition:transform .15s;color:var(--primary)}
.tree-node.collapsed > .tree-toggle .arrow{transform:rotate(-90deg)}
.tree-children{overflow:hidden;max-height:9999px;transition:max-height .25s}
.tree-node.collapsed > .tree-children{max-height:0}
.tree-node .kp-name{font-size:13px}
.tree-node .kp-formula{font-size:12px;color:var(--text-light);font-style:italic;margin-left:4px}
.tree-node .mastered{width:15px;height:15px;border:1.5px solid var(--border);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:8px;color:transparent;cursor:pointer;margin-left:5px;vertical-align:middle}
.tree-node .mastered.on{background:var(--success);border-color:var(--success);color:#fff}

/* ============ 成语卡 ============ */
.idiom-card{background:var(--card);border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:13px;margin-bottom:11px;transition:box-shadow .15s}
.idiom-card:hover{box-shadow:var(--shadow-md)}
.idiom-card .i-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
.idiom-card .i-word{font-size:18px;font-weight:700;color:var(--primary-dark)}
.i-example{background:var(--info-bg);padding:7px 10px;border-radius:var(--radius-sm);font-size:12px;line-height:1.7;color:var(--info);border-left:3px solid var(--info)}

/* ============ 精读库 ============ */
.jd-topic-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1100px){.jd-topic-grid{grid-template-columns:1fr 1fr}}
.jd-topic-card{border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .18s;border:1.5px solid var(--border-light);background:var(--card);box-shadow:var(--shadow);position:relative;overflow:hidden}
.jd-topic-card:hover{box-shadow:var(--shadow-md);border-color:var(--primary);transform:translateY(-2px)}
.jd-topic-card.active{border-color:var(--primary);background:var(--primary-bg)}
.jd-topic-card .jd-t-icon{font-size:28px;margin-bottom:8px}
.jd-topic-card .jd-t-name{font-weight:700;font-size:14px;color:var(--primary-dark);margin-bottom:3px}
.jd-topic-card .jd-t-count{font-size:11px;color:var(--text-muted)}
.jd-topic-card .jd-t-badge{position:absolute;top:10px;right:10px;background:var(--accent);color:#fff;font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600}
.jd-article-card{border-left:3px solid var(--primary);padding:14px;margin-bottom:10px;background:var(--card);border-radius:0 var(--radius-sm) var(--radius-sm) 0;box-shadow:var(--shadow)}
.jd-article-card .jd-a-title{font-weight:600;font-size:14.5px;color:var(--primary-dark);margin-bottom:6px}
.jd-article-card .jd-a-meta{font-size:11px;color:var(--text-muted);margin-bottom:8px}
.jd-section{margin:12px 0;padding:12px 14px;border-radius:var(--radius-sm);font-size:12.5px;line-height:1.8}
.jd-section.jd-structure{background:#f0f7ff;border-left:3px solid var(--info)}
.jd-section.jd-template{background:#fff9e6;border-left:3px solid var(--accent)}
.jd-section.jd-sentences{background:var(--primary-bg);border-left:3px solid var(--primary)}
.jd-section.jd-interview{background:#ede4ff;border-left:3px solid var(--purple)}
.jd-section.jd-tips{background:#fdf0f0;border-left:3px solid var(--danger)}
.jd-section b{display:block;margin-bottom:5px;color:var(--text);font-size:13px}
.jd-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.jd-tag{font-size:10.5px;padding:3px 9px;border-radius:10px;background:var(--bg);color:var(--text-light);border:1px solid var(--border)}
.jd-article-detail{display:none}
.jd-article-detail.show{display:block;animation:fade .25s ease}
.jd-back{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--primary);font-size:13px;margin-bottom:14px}
.jd-back:hover{color:var(--primary-dark)}
.jd-full-text{background:var(--bg);padding:14px 16px;border-radius:var(--radius-sm);font-size:13px;line-height:2;max-height:400px;overflow-y:auto;margin:10px 0;border:1px solid var(--border-light)}

/* ============ 思维导图(mindmap) ============ */
.mm-tree{position:relative;padding-left:0}
.mm-node{position:relative;margin:4px 0;padding:6px 10px 6px 28px;border-radius:6px;font-size:12.5px;line-height:1.7;border-left:2px solid transparent;transition:all .12s}
.mm-node:hover{background:rgba(0,0,0,.02)}
.mm-node.mm-root{font-weight:700;font-size:13.5px;padding:8px 12px;margin:8px 0 4px;border-radius:8px;border-left-width:0;padding-left:12px}
.mm-node.mm-root::before{display:none}
.mm-node::before{content:'';position:absolute;left:10px;top:14px;width:6px;height:6px;border-radius:50%}
.mm-node.mm-l2{padding-left:44px}
.mm-node.mm-l2::before{left:26px}
.mm-node.mm-l3{padding-left:60px;font-size:11.5px;color:var(--text-light)}
.mm-node.mm-l3::before{left:42px;width:4px;height:4px}
.mm-tree .mm-branch{position:relative}
.mm-tree .mm-branch::after{content:'';position:absolute;left:13px;top:14px;bottom:0;width:1px;background:var(--border)}
.mm-tree .mm-branch>.mm-node:last-child::after{content:'';position:absolute;left:13px;top:14px;bottom:50%;width:1px;background:var(--bg)}
.mm-tree.mm-blue .mm-root{background:#f0f7ff;border-left:3px solid var(--info);color:#1a56db}
.mm-tree.mm-blue .mm-node::before{background:var(--info)}
.mm-tree.mm-gold .mm-root{background:#fff9e6;border-left:3px solid var(--accent);color:#92400e}
.mm-tree.mm-gold .mm-node::before{background:var(--accent)}
.mm-tree.mm-green .mm-root{background:var(--primary-bg);border-left:3px solid var(--primary);color:var(--primary-dark)}
.mm-tree.mm-green .mm-node::before{background:var(--primary)}
.mm-tree.mm-purple .mm-root{background:#ede4ff;border-left:3px solid var(--purple);color:#6d28d9}
.mm-tree.mm-purple .mm-node::before{background:var(--purple)}
.mm-tree.mm-red .mm-root{background:#fdf0f0;border-left:3px solid var(--danger);color:#991b1b}
.mm-tree.mm-red .mm-node::before{background:var(--danger)}

/* ============ 模态框 ============ */
.modal-mask{position:fixed;inset:0;background:rgba(31,107,66,.35);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal-mask.show{display:flex}
.modal{background:var(--card);border-radius:var(--radius);width:540px;max-width:100%;max-height:85vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow-md)}
.modal h3{font-size:16px;margin-bottom:16px;color:var(--primary-dark)}
.modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}

/* ============ 知识点覆盖度 ============ */
.cov-bar{display:flex;height:22px;border-radius:11px;overflow:hidden;margin:4px 0}
.cov-bar .cov-done{background:var(--success);transition:width .3s}
.cov-bar .cov-undone{background:var(--border-light)}
.cov-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border-light)}
.cov-row .cov-name{width:80px;font-weight:600;font-size:12.5px}
.cov-row .cov-bar-wrap{flex:1}
.cov-row .cov-num{font-size:11px;color:var(--text-light);width:70px;text-align:right;white-space:nowrap}
.coverage-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ============ 笔记聚合 ============ */
.note-card{border-left:3px solid var(--primary);padding:12px 14px;margin-bottom:10px;background:var(--card);border-radius:0 var(--radius-sm) var(--radius-sm) 0;box-shadow:var(--shadow)}
.note-card.note-mistake{border-left-color:var(--danger)}
.note-card.note-qiushi{border-left-color:var(--info)}
.note-card.note-course{border-left-color:var(--accent)}
.note-card .note-type{font-size:10px;text-transform:uppercase;padding:2px 7px;border-radius:8px;display:inline-block;margin-bottom:6px}
.note-card .note-type.note-mistake{background:#fce8e7;color:var(--danger)}
.note-card .note-type.note-qiushi{background:var(--info-bg);color:var(--info)}
.note-card .note-type.note-course{background:#fdf6e8;color:var(--warn)}
.note-card .note-title{font-weight:600;font-size:13.5px;margin-bottom:4px}
.note-card .note-body{font-size:12.5px;color:var(--text-light);line-height:1.7}
.note-card .note-meta{font-size:11px;color:var(--text-muted);margin-top:6px}

/* ============ 杂项 ============ */
.empty{text-align:center;padding:36px 20px;color:var(--text-muted);font-size:13px}
.empty .ico{font-size:28px;display:block;margin-bottom:6px;opacity:.4}
.flex{display:flex;align-items:center;gap:8px}
.flex.between{justify-content:space-between}
.flex.wrap{flex-wrap:wrap}
.mt-6{margin-top:6px}.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.mb-6{margin-bottom:6px}.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}
.text-center{text-align:center}
.text-muted{color:var(--text-muted)}
.text-sm{font-size:12px}
.text-xs{font-size:11px}
.text-lg{font-size:16px}
.text-bold{font-weight:600}
.text-primary{color:var(--primary-dark)}
.text-success{color:var(--success)}
.text-danger{color:var(--danger)}
.text-info{color:var(--info)}
.stat-num{font-size:26px;font-weight:700;color:var(--primary-dark)}
.stat-label{font-size:11px;color:var(--text-light)}
.stat-card{text-align:center;padding:14px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.stat-card .stat-num{display:block}
.divider{height:1px;background:var(--border-light);margin:12px 0}
.badge-due{display:inline-block;padding:2px 6px;background:var(--danger);color:#fff;border-radius:4px;font-size:10px;margin-left:5px}
.scroll-y{max-height:420px;overflow-y:auto}
.tab-bar{display:flex;gap:4px;margin-bottom:14px;border-bottom:2px solid var(--border-light);padding-bottom:0}
.tab-bar .tab{padding:7px 16px;font-size:13px;cursor:pointer;color:var(--text-light);border-bottom:2px solid transparent;margin-bottom:-2px}
.tab-bar .tab.active{color:var(--primary-dark);border-bottom-color:var(--primary);font-weight:600}

/* 日历 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-cell{aspect-ratio:1.1;background:var(--bg);border-radius:5px;padding:5px;font-size:11px;position:relative}
.cal-cell.has-event{background:var(--primary-bg)}
.cal-cell.today{box-shadow:0 0 0 2px var(--accent)}
.cal-cell .d-num{font-weight:600}
.cal-cell .d-event{font-size:9px;color:var(--primary-dark);margin-top:2px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-head{text-align:center;font-size:11px;color:var(--text-muted);font-weight:600;padding:4px 0}

/* 阶段切换 */
.phase-steps{display:flex;gap:0;margin-bottom:16px}
.phase-step{flex:1;padding:10px 14px;background:var(--bg);border-radius:0;font-size:12px;text-align:center;position:relative;border-right:2px solid #fff}
.phase-step:last-child{border-right:none}
.phase-step.active{background:var(--primary);color:#fff}
.phase-step.done{background:var(--primary-bg);color:var(--primary-dark)}
.phase-step .ph-name{font-weight:600;font-size:13px}
.phase-step .ph-range{font-size:10px;opacity:.7;margin-top:2px}

/* 四列任务对照表 */
.four-col-table{width:100%;border-collapse:collapse;font-size:11.5px}
.four-col-table th{padding:6px 7px;text-align:left;background:var(--primary-bg);color:var(--primary-dark);font-size:11px;font-weight:600;border-bottom:2px solid var(--primary)}
.four-col-table td{padding:6px 7px;border-bottom:1px solid var(--border-light);vertical-align:top}
.four-col-table .fc-cat{font-weight:600;color:var(--primary-dark);white-space:nowrap}

/* ============ 移动端适配 ============ */
@media(max-width:768px){
  .app{flex-direction:column}
  .sidebar{
    position:relative;width:100%;padding:12px 0 0;
    background:linear-gradient(135deg,var(--primary-dark),var(--primary));
  }
  .sidebar .logo{padding:0 16px 10px;margin-bottom:8px}
  .sidebar .logo h1{font-size:15px}
  .sidebar .countdown-mini{padding:8px 16px;margin-bottom:4px}
  .sidebar .countdown-mini b{font-size:16px;display:inline;margin-left:4px}
  .sidebar .nav-scroll{display:flex;overflow-x:auto;padding:6px 12px;gap:2px;-webkit-overflow-scrolling:touch}

  .countdown-box .days{font-size:42px}

  .modal{width:95%;margin:10px;padding:16px;max-height:90vh}

}

/* ============ 阶段与每日推送 ============ */
function getCurrentPhase(date){
  for(const p of DB.phases){if(date>=p.range[0]&&date<=p.range[1])return p}
  return DB.phases[DB.phases.length-1];
}

function getDaily(date){
  if(!DB.plans.daily[date]){
    const phase=getCurrentPhase(date);
    const slots=TIME_SLOTS.map((s,i)=>({...s,done:false}));
    DB.plans.daily[date]={phase:phase.name,slots:slots,habits:{阅读:false,速算:false,词语:false,错题:false,复盘:false}};
    save();
  }
  return DB.plans.daily[date];
}

function habitName(k){return {阅读:'每日阅读',速算:'速算练习',词语:'词语积累',错题:'错题复盘',复盘:'当日复盘'}[k]||k}
function toggleSlot(i){const d=getDaily(today());d.slots[i].done=!d.slots[i].done;save();renderDashboard()}
function toggleHabit(k){const d=getDaily(today());d.habits[k]=!d.habits[k];save();renderDashboard()}
function resetToday(){if(confirm('重新生成今日任务？')){delete DB.plans.daily[today()];getDaily(today());save();renderDashboard()}}

/* ============ 雷达图 ============ */
function radarChart(data){
  const entries=Object.entries(data);const n=entries.length;
  const cx=140,cy=120,R=88;
  const angles=entries.map((_,i)=>-Math.PI/2+i*2*Math.PI/n);
  let grid='';
  for(const r of [.25,.5,.75,1]){
    const pts=angles.map(a=>cx+Math.cos(a)*R*r+','+(cy+Math.sin(a)*R*r)).join(' ');
    grid+='<polygon points="'+pts+'" fill="none" stroke="#ddd8cc" stroke-width="1"/>';
  }
  let axes=angles.map((a,i)=>{
    const x=cx+Math.cos(a)*R,y=cy+Math.sin(a)*R;
    const lx=cx+Math.cos(a)*(R+14),ly=cy+Math.sin(a)*(R+14);
    return '<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="#ddd8cc"/><text x="'+lx+'" y="'+ly+'" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#7a7268">'+entries[i][0]+'</text>';
  }).join('');
  const dataPts=entries.map((e,i)=>{const v=e[1]/100;return cx+Math.cos(angles[i])*R*v+','+(cy+Math.sin(angles[i])*R*v)}).join(' ');
  const dots=entries.map((e,i)=>{const v=e[1]/100;return '<circle cx="'+(cx+Math.cos(angles[i])*R*v)+'" cy="'+(cy+Math.sin(angles[i])*R*v)+'" r="3" fill="#8FA88D"/>'}).join('');
  return '<svg viewBox="0 0 280 240" style="width:240px;height:auto">'+grid+axes+'<polygon points="'+dataPts+'" fill="rgba(120,110,95,0.15)" stroke="#8FA88D" stroke-width="2"/>'+dots+'</svg>';
}

}

function renderCoveragePanel(){
  const mm=DB.mindmaps;const modules=['资料分析','判断推理','言语理解','数量关系','常识判断','申论'];
  const practiceMods=DB.practice.modules;const mapToMm={'资料':'资料分析','判断':'判断推理','言语':'言语理解','数量':'数量关系','常识':'常识判断'};
  return modules.map(mod=>{
    const cats=mm[mod]||{};let totalKp=0,masteredKp=0;
    for(const c of Object.values(cats)){if(c.points){totalKp+=c.points.length;masteredKp+=c.points.filter(p=>p.mastered).length}}
    let practiced=0;
    for(const[pm,pd]of Object.entries(practiceMods)){if(mapToMm[pm]===mod){practiced=pd.fenbi.c+pd.chaoge.c+pd.kua.c+pd.big.c;break}}
    const covPct=totalKp?Math.round(masteredKp/totalKp*100):0;
    const intensity=practiced>=200?'高':practiced>=80?'中':practiced>0?'低':'未练';
    const iColor=intensity==='高'?'var(--success)':intensity==='中'?'var(--info)':intensity==='低'?'var(--warn)':'var(--danger)';
    return '<div style="padding:14px;background:var(--bg);border-radius:8px"><div class="flex between mb-6"><span class="text-bold">'+mod+'</span><span class="tag '+(covPct>=70?'green':covPct>=40?'yellow':'red')+'">'+covPct+'% 掌握</span></div><div class="cov-bar"><div class="cov-done" style="width:'+covPct+'%"></div><div class="cov-undone" style="flex:1"></div></div><div class="flex between mt-8"><span class="text-xs text-muted">知识点：'+masteredKp+'/'+totalKp+'</span><span class="text-xs" style="color:'+iColor+'">刷题量：'+practiced+'题（'+intensity+'）</span></div></div>';
  }).join('');
}

function barChart(history){
  const max=Math.max(...history.map(h=>h.fenbi+h.chaoge+h.kua+h.big),1);
  const w=42,gap=18;
  return '<svg viewBox="0 0 '+(history.length*(w+gap)+30)+' 200" style="width:100%;max-width:600px;height:200px">'+
    history.map((h,i)=>{
      const x=15+i*(w+gap);const colors=[['粉笔',h.fenbi,'#8FA88D'],['超格',h.chaoge,'#3b82c4'],['夸夸',h.kua,'#39D6C2'],['大杯',h.big,'#8b5cf6']];
      let yBase=170;
      const bars=colors.map(([n,v,c])=>{const bh=v/max*150;yBase-=bh;return '<rect x="'+x+'" y="'+yBase+'" width="'+w+'" height="'+bh+'" fill="'+c+'" opacity=".85"/>'}).join('');
      const total=h.fenbi+h.chaoge+h.kua+h.big;
      return bars+'<text x="'+(x+w/2)+'" y="185" text-anchor="middle" font-size="10" fill="#7a7268">'+new Date(h.date).getDate()+'日</text><text x="'+(x+w/2)+'" y="'+(yBase-4)+'" text-anchor="middle" font-size="9" fill="#3a3530" font-weight="600">'+total+'</text>';
    }).join('')+
    '<rect x="15" y="0" width="9" height="9" fill="#8FA88D"/><text x="28" y="8" font-size="10">粉笔</text><rect x="65" y="0" width="9" height="9" fill="#3b82c4"/><text x="78" y="8" font-size="10">超格</text><rect x="115" y="0" width="9" height="9" fill="#39D6C2"/><text x="128" y="8" font-size="10">夸夸</text><rect x="165" y="0" width="9" height="9" fill="#8b5cf6"/><text x="178" y="8" font-size="10">大杯</text></svg>';
}

function savePractice(){
  const src=$('#p-src').value,mod=$('#p-mod').value,cnt=+$('#p-count').value,cor=+$('#p-correct').value;
  DB.practice.modules[mod][src].c+=cnt;DB.practice.modules[mod][src].r+=cor;
  const t=today();let h=DB.practice.records.find(r=>r.date===t);
  if(h)h[src]+=cnt;else DB.practice.records.push({date:t,fenbi:src==='fenbi'?cnt:0,chaoge:src==='chaoge'?cnt:0,kua:src==='kua'?cnt:0,big:src==='big'?cnt:0});
  if(DB.practice.records.length>30)DB.practice.records=DB.practice.records.slice(-30);
  save();closeModal();renderPractice();
}

function renderMistakeList(ms){

  }).join('');
}
function filterMistake(q){
  q=q.toLowerCase();const mod=$('#ms-filter')?$('#ms-filter').value:'';const src=$('#ms-src')?$('#ms-src').value:'';
  const filtered=DB.mistakes.filter(m=>(!q||m.question.toLowerCase().includes(q)||m.analysis.toLowerCase().includes(q))&&(!mod||m.module===mod)&&(!src||m.source===src));
  $('#ms-list').innerHTML=renderMistakeList(filtered);
}
function pieChart(data){
  const entries=Object.entries(data);const total=entries.reduce((s,e)=>s+e[1],0);
  const colors=['#d4544e','#39D6C2','#8b5cf6','#3b82c4','#8FA88D'];
  let angle=-Math.PI/2;let slices='';const cx=70,cy=70,R=55;
  entries.forEach((e,i)=>{
    const pct=e[1]/total;const a2=angle+pct*2*Math.PI;
    const x1=cx+Math.cos(angle)*R,y1=cy+Math.sin(angle)*R,x2=cx+Math.cos(a2)*R,y2=cy+Math.sin(a2)*R;
    const large=pct>0.5?1:0;
    slices+='<path d="M'+cx+','+cy+' L'+x1+','+y1+' A'+R+','+R+' 0 '+large+',1 '+x2+','+y2+' Z" fill="'+colors[i%5]+'"/>';
    angle=a2;
  });
  return '<div class="flex" style="gap:14px;align-items:center"><svg viewBox="0 0 140 140" style="width:130px;height:130px">'+slices+'</svg><div>'+entries.map((e,i)=>'<div class="flex" style="gap:5px;margin-bottom:4px"><div style="width:11px;height:11px;background:'+colors[i%5]+';border-radius:2px"></div><span class="text-sm">'+e[0]+' ('+e[1]+')</span></div>').join('')+'</div></div>';
}

async function autoSearchIdiom(){
  const word=$('#i-word').value.trim();if(!word){alert('请先输入成语');return}
  const btn=$('#i-search-btn');const status=$('#i-search-status');
  btn.textContent='\u23f3 搜索中...';btn.disabled=true;
  status.textContent='正在人民日报/求是网搜索「'+word+'」的释义和例句...';
  try{
    let meaning='',example='';
    try{const zdicUrl='https://api.allorigins.win/raw?url='+encodeURIComponent('https://www.zdic.net/hans/'+encodeURIComponent(word));const resp=await fetch(zdicUrl);const html=await resp.text();const mMatch=html.match(/<p[^>]*>\u25ce[^<]*<[^>]*>([^<]+)</);if(mMatch)meaning=mMatch[1].trim();const eMatch=html.match(/\u793a\u4f8b[^<]*<[^>]*>([^<]+)</);if(eMatch)example=eMatch[1].trim()}catch(e){}
    if(!example){try{const rmrbUrl='https://api.allorigins.win/raw?url='+encodeURIComponent('https://www.baidu.com/s?wd='+encodeURIComponent(word+' site:people.com.cn'));const resp2=await fetch(rmrbUrl);const html2=await resp2.text();const div=document.createElement('div');div.innerHTML=html2;const snippets=div.querySelectorAll('.c-abstract,.c-span-last');for(const s of snippets){const txt=s.innerText.trim();if(txt.includes(word)&&txt.length>20&&txt.length<200){example=txt;break}}}catch(e){}}
    if(!meaning){try{const bkUrl='https://api.allorigins.win/raw?url='+encodeURIComponent('https://baike.baidu.com/item/'+encodeURIComponent(word));const resp3=await fetch(bkUrl);const html3=await resp3.text();const mMatch2=html3.match(/<meta name="description" content="([^"]+)"/);if(mMatch2){const desc=mMatch2[1].trim();const idx=desc.indexOf('\u3002');meaning=idx>0?desc.substring(0,idx+1):desc.substring(0,100)}}catch(e){}}
    if(meaning){$('#i-meaning').value=meaning;status.textContent='\u2705 已找到释义';status.style.color='var(--success)'}
    if(example){$('#i-example').value=example;status.textContent=(meaning?'\u2705 已找到释义和例句':'\u2705 已找到例句');status.style.color='var(--success)'}
    if(!meaning&&!example){status.textContent='\u26a0\ufe0f 未找到结果，请手动填入';status.style.color='var(--danger)'}
  }catch(e){status.textContent='\u26a0\ufe0f 搜索失败：'+e.message;status.style.color='var(--danger)'}
  btn.textContent='\ud83d\udd0d 重新搜索';btn.disabled=false;
}

function saveIdiom(id){
  const data={word:$('#i-word').value.trim(),tone:$('#i-tone').value,meaning:$('#i-meaning').value.trim(),example:$('#i-example').value.trim()};
  if(id){let item=DB.idioms.custom.find(c=>c.id===id);if(item){Object.assign(item,data)}else if(DB.idioms.items[id]){Object.assign(DB.idioms.items[id],{w:data.word,m:data.meaning,t:data.tone,e:data.example})}}
  else{const newId=uid();DB.idioms.custom.push({id:newId,...data})}
  save();closeModal();renderIdioms();
}
function delIdiom(id){DB.idioms.custom=DB.idioms.custom.filter(c=>c.id!==id);if(DB.idioms.items[id])DB.idioms.items[id]._hidden=true;save();renderIdioms()}

function idiomReview(){
  const all=[];DB.idioms.banks.forEach(b=>{b.groups.forEach(g=>{g.idioms.forEach(id=>{const item=DB.idioms.items[id];if(item&&!item._hidden)all.push({...item,id})})})});DB.idioms.custom.forEach(c=>all.push({w:c.word,m:c.meaning,t:c.tone,e:c.example,id:c.id}));
  if(all.length<2){alert('至少需要2个成语');return}
  let idx=0;
  const showCard=()=>{
    const i=all[idx];
    showModal('<h3>成语复习 <span class="tag">'+(idx+1)+'/'+all.length+'</span></h3><div style="text-align:center;padding:20px;cursor:pointer" onclick="flipReview()"><div id="front"><div style="font-size:28px;font-weight:700;color:var(--primary-dark);margin-bottom:10px">'+esc(i.w||i.word)+'</div><div class="text-muted text-sm">点击查看释义</div></div><div id="back" style="display:none"><div style="font-size:22px;font-weight:700;color:var(--primary-dark);margin-bottom:8px">'+esc(i.w||i.word)+'</div><div class="text-sm" style="margin-bottom:8px">'+esc(i.m||i.meaning)+'</div><div class="i-example" style="text-align:left">'+esc(i.e||i.example)+'</div></div></div><div class="flex" style="justify-content:space-between;margin-top:16px"><button class="btn ghost sm" onclick="prevIdiom()">上一个</button><button class="btn ghost sm" onclick="closeModal()">\u2715 关闭</button><button class="btn sm" onclick="nextIdiom()">下一个</button></div>');
  };
  showCard();
  window.flipReview=()=>{$('#front').style.display=$('#front').style.display==='none'?'block':'none';$('#back').style.display=$('#back').style.display==='none'?'block':'none'};
  window.prevIdiom=()=>{idx=(idx-1+all.length)%all.length;showCard()};
  window.nextIdiom=()=>{idx=(idx+1)%all.length;showCard()};
}

/* ============ 文本→思维导图解析 ============ */
function parseToMindmap(text,color){
  if(!text)return'';
  const lines=text.split('\n').filter(l=>l.trim());
  let html='<div class="mm-branch">';let inSub=false;
  lines.forEach((line,i)=>{
    const t=line.trim();
    const isRoot=/^【.+】/.test(t)||/^[①②③④⑤⑥⑦⑧⑨⑩]/.test(t)||/^\d+[\.\、）)]/.test(t);
    const isL2=/^[①②③④⑤⑥⑦⑧⑨⑩]/.test(t)||/^[a-zA-Z]\./.test(t)||/^\d+[\.\、）)]/.test(t);
    const isInterviewL2=/^\d+\.\s/.test(t);
    if(isRoot&&!isInterviewL2){
      if(inSub){html+='</div>';inSub=false}
      html+='</div><div class="mm-branch"><div class="mm-node mm-root">'+esc(t)+'</div>';
    }else if(isL2||isInterviewL2){
      if(!inSub){inSub=true}
      html+='<div class="mm-node mm-l2">'+esc(t)+'</div>';
    }else{html+='<div class="mm-node mm-l3">'+esc(t)+'</div>'}
  });
  html+='</div>';
  return html;
}

  const mm=DB.mindmaps;let total=0,done=0;

  $('#page-mindmap').innerHTML=`

    <div class="card"><div class="flex between mb-12"><span class="text-sm text-muted">整体掌握率</span><span class="tag green">${Math.round(done/total*100)}%</span></div><div class="progress" style="height:11px"><div class="success" style="width:${done/total*100}%"></div></div></div>
    <div class="card">
      <div class="mindmap-tabs">

function renderCalendar(){

  const daysInMonth=new Date(y,m+1,0).getDate();

  const monthStr=y+'年'+(m+1)+'月';
  let cells='';['日','一','二','三','四','五','六'].forEach(d=>cells+='<div class="cal-head">'+d+'</div>');
  for(let i=0;i<startD;i++)cells+='<div class="cal-cell"></div>';
  for(let d=1;d<=daysInMonth;d++){const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');const ev=events[ds];const isToday=ds===today();cells+='<div class="cal-cell '+(ev?'has-event':'')+' '+(isToday?'today':'')+'"><div class="d-num">'+d+'</div>'+(ev?'<div class="d-event">'+esc(ev.event)+'</div>':'')+'</div>'}

    <div class="grid grid-4">
      <div class="stat-card"><span class="stat-num text-danger">${mistakeCount}</span><span class="stat-label">错题笔记</span></div>
      <div class="stat-card"><span class="stat-num text-info">${qiushiCount}</span><span class="stat-label">精读笔记</span></div>
      <div class="stat-card"><span class="stat-num" style="color:var(--warn)">${courseCount}</span><span class="stat-label">课程笔记</span></div>
      <div class="stat-card"><span class="stat-num text-primary">${notes.length}</span><span class="stat-label">笔记总数</span></div>
    </div>
    <div class="card mt-16">
      <div class="flex mb-12" style="gap:8px">
        <input class="input" id="note-search" placeholder="搜索笔记内容..." oninput="filterNotes(this.value)" style="max-width:280px">
        <select class="input" id="note-type-filter" onchange="filterNotes($(\'#note-search\').value)" style="max-width:140px"><option value="">全部类型</option><option value="mistake">错题笔记</option><option value="qiushi">精读笔记</option><option value="course">课程笔记</option></select>
        <select class="input" id="note-mod-filter" onchange="filterNotes($(\'#note-search\').value)" style="max-width:140px"><option value="">全部模块</option>${[...new Set(notes.map(n=>n.module))].map(m=>'<option>'+m+'</option>').join('')}</select>
      </div>
      <div id="note-list">${renderNoteList(notes)}</div>
    </div>
  `;
}
function renderNoteList(notes){
  if(!notes.length)return '<div class="empty"><span class="ico">\ud83d\udcdd</span>暂无笔记。在错题集、精读库或超格课程中记录笔记后会自动聚合到这里。</div>';
  return notes.map(n=>'<div class="note-card note-'+n.type+'"><span class="note-type note-'+n.type+'">'+(n.type==='mistake'?'错题':n.type==='qiushi'?'精读':'课程')+'</span><div class="note-title">'+esc(n.title)+'</div><div class="note-body">'+esc(n.body)+'</div>'+(n.extra?'<div class="text-sm mt-6" style="color:var(--text-light);background:var(--bg);padding:5px 8px;border-radius:4px">'+esc(n.extra)+'</div>':'')+'<div class="note-meta">'+n.meta+'</div></div>').join('');
}
function filterNotes(q){
  q=q.toLowerCase();const typeFilter=$('#note-type-filter')?$('#note-type-filter').value:'';const modFilter=$('#note-mod-filter')?$('#note-mod-filter').value:'';
  const notes=[];DB.mistakes.forEach(m=>{notes.push({type:'mistake',title:m.module+' · '+m.cause,body:m.question,meta:fmtDate(m.date)+' · '+esc(m.source),extra:'解析：'+m.analysis,module:m.module})});
  DB.jingdu.topics.forEach(t=>{t.articles.forEach(a=>{notes.push({type:'qiushi',title:'精读：'+a.title,body:a.sentences||a.structure||'',meta:fmtDate(a.date)+' · '+t.name,extra:a.words||'',module:t.name})})});
  Object.entries(DB.chaoge).forEach(([lk,l])=>{l.modules.forEach(m=>{m.lessons.forEach(lesson=>{if(lesson.done&&lesson.notes){notes.push({type:'course',title:'课程：'+m.name+' - '+lesson.name,body:lesson.notes,meta:'超格精讲桶 · '+lk,module:m.name})}})})});
  const filtered=notes.filter(n=>(!q||n.title.toLowerCase().includes(q)||n.body.toLowerCase().includes(q)||(n.extra||'').toLowerCase().includes(q))&&(!typeFilter||n.type===typeFilter)&&(!modFilter||n.module===modFilter));
  $('#note-list').innerHTML=renderNoteList(filtered);
}

/* ============ 模态框 ============ */
function showModal(html){$('#modal-root').innerHTML='<div class="modal">'+html+'</div>';$('#modal-root').classList.add('show')}
function closeModal(){$('#modal-root').classList.remove('show');$('#modal-root').innerHTML=''}

/* ============ 导航 ============ */
function nav(page){
  $$('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));
  $$('.page').forEach(p=>p.classList.toggle('active',p.id==='page-'+page));
  const fn={dashboard:renderDashboard,plan:renderPlan,chaoge:renderChaoge,practice:renderPractice,mistakes:renderMistakes,idioms:renderIdioms,qiushi:renderQiushi,mindmap:renderMindmap,calendar:renderCalendar,notes:renderNotes};
  if(fn[page])fn[page]();
}
function resetData(){if(confirm('确定重置所有数据为示例数据？')){localStorage.removeItem('gkwb_data_v2');DB=defaultData();save();nav('dashboard')}}

/* ============ 数据导出/导入 ============ */
function exportData(){
  const data=JSON.stringify(DB,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='gkwb-backup-'+today()+'.json';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  // 移动端提示
  const isMobile=/iPhone|iPad|Android/i.test(navigator.userAgent);
  if(isMobile){
    alert('✅ 导出成功！\n\n请将下载的文件保存到iCloud/文件App中。\n\n在另一台设备上，点击「📥 导入数据」选择该文件即可同步。');
  }
}

function importData(input){
  const file=input.files[0];
  if(!file)return;
  if(!confirm('⚠️ 导入将覆盖当前所有数据（错题、精读、课程进度等）。\n\n确定要导入吗？')){input.value='';return}
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.profile||!data.chaoge){throw new Error('数据格式不正确')}
      DB=data;
      save();
      alert('✅ 导入成功！数据已更新。');
      nav('dashboard');
    }catch(err){
      alert('❌ 导入失败：文件格式不正确。\n\n请确保导入的是「导出数据」生成的文件。');
    }
    input.value='';
  };
  reader.readAsText(file);
}

/* ============ 初始化 ============ */
$$('.nav-item').forEach(n=>n.addEventListener('click',()=>nav(n.dataset.page)));
getDaily(today());
renderDashboard();
</script>
</body>
</html>
